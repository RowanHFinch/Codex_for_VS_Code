name: Validate extension
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      startup_diagnostics:
        type: boolean
        default: false
        description: Run isolated Windows startup reproduction
      runtime_version:
        type: string
        default: '0.163.0'
        description: Codex CLI version for native checks (0.152.0 reproduces the pre-fix SQLite startup path)
permissions:
  contents: read
jobs:
  offline:
    if: ${{ !inputs.startup_diagnostics }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:local
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: independent-codex-${{ matrix.os }}
          path: |
            dist/*.vsix
            dist/*.sha256
            dist/release-verification.json
  editor:
    if: ${{ !inputs.startup_diagnostics }}
    env:
      CODEX_TEST_VSIX: dist/codex-for-vscode-0.9.0.vsix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:local
      - run: npm install --global @openai/codex@${{ inputs.runtime_version || '0.163.0' }}
      - run: npm run test:oauth
      - run: npm run test:elicitation
      - run: npm run test:agents
      - run: npm run test:integrations
        env:
          CODEX_STARTUP_DIAGNOSTICS: '1'
      - run: npm run test:foundation
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a npm run test:editor' || 'npm run test:editor' }}
      - if: runner.os != 'Windows'
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a npm run test:editor' || 'npm run test:editor' }}
        env:
          CODEX_EDITOR_UI: '1'
          CODEX_UI_SIDEBAR: '1'
      - if: runner.os != 'Windows'
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a npm run test:editor' || 'npm run test:editor' }}
        env:
          CODEX_EDITOR_UI: '1'
          CODEX_UI_MCP: '1'
  windows-startup:
    if: ${{ inputs.startup_diagnostics }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2]
    runs-on: windows-latest
    env:
      CODEX_STARTUP_DIAGNOSTICS: '1'
      CODEX_STARTUP_CONCURRENT: ${{ matrix.worker == 2 && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global @openai/codex@${{ inputs.runtime_version || '0.163.0' }}
      - name: Reproduce native startup without retries
        run: |
          foreach ($check in @('test:oauth', 'test:elicitation', 'test:agents')) {
            npm run $check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $rounds = if ($env:CODEX_STARTUP_CONCURRENT -eq '1') { 5 } else { 25 }
          for ($i = 1; $i -le $rounds; $i++) {
            Write-Output "STARTUP ITERATION $i; CONCURRENT=$env:CODEX_STARTUP_CONCURRENT"
            if ($env:CODEX_STARTUP_CONCURRENT -eq '1') {
              npm run test:integrations
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } else {
              $children = 1..4 | ForEach-Object {
                Start-Process node.exe -ArgumentList @('node_modules/tsx/dist/cli.mjs', 'scripts/integration-smoke.ts') -NoNewWindow -PassThru
              }
              $failed = $false
              foreach ($child in $children) {
                $child.WaitForExit()
                if ($child.ExitCode -ne 0) { $failed = $true }
                $child.Dispose()
              }
              if ($failed) { exit 1 }
            }
          }
